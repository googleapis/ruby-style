name: Release-Please Now

permissions:
  contents: read
  pull-requests: write # Required for 'toys release label-please' to add PR labels

on:
  workflow_dispatch:
    inputs:
      args:
        description: "Extra command line arguments."
        required: false

jobs:
  add-release-please-label:
    if: ${{ github.repository == 'googleapis/ruby-style' }}
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_PLEASE_DISABLE: ${{ secrets.RELEASE_PLEASE_DISABLE }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Ruby 3.3
        uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9 # v1.316.0
        with:
          ruby-version: "3.3"
      - name: Install tools
        run: |
          gem install --no-document toys
      - name: execute
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_INPUTS_ARGS: ${{ github.event.inputs.args }}
        run: |
          toys release label-please -v \
            --github-event-name="$GITHUB_EVENT_NAME" \
            $GITHUB_EVENT_INPUTS_ARGS
